version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ficaqui_db
    restart: always
    environment:
      POSTGRES_USER: ficaqui
      POSTGRES_PASSWORD: ficaqui_password
      POSTGRES_DB: ficaqui_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ficaqui_backend
    restart: always
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://ficaqui:ficaqui_password@db:5432/ficaqui_db?schema=public
      - GROQ_API_KEY=${VITE_GROQ_API_KEY:-}
    depends_on:
      - db
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ficaqui_frontend
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
